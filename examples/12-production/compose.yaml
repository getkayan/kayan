services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: kayan
      POSTGRES_USER: kayan
      POSTGRES_PASSWORD: kayan
    ports:
      - "5432:5432"
    volumes:
      - kayan-postgres:/var/lib/postgresql/data
      - ../../kayan-gorm/migrations/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kayan -d kayan"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - kayan-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  kayan-postgres:
  kayan-redis:
