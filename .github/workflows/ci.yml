name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.25.x'

jobs:
  api-compatibility:
    name: Public API compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Install pinned apidiff
        run: go install golang.org/x/exp/cmd/apidiff@v0.0.0-20260709172345-9ea1abe57597
      - name: Reject incompatible exported API changes
        run: bash scripts/check-api.sh

  module-isolation:
    name: Modules build from their own go.mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # go.work is gitignored, so contributors build in workspace mode and CI
      # does not. This job names that divergence instead of letting it surface
      # as an unrelated-looking test failure.
      - name: Build every module with GOWORK=off
        run: bash scripts/check-modules.sh

  consumable:
    name: Consumers can import the published modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # module-isolation builds each module where its own replace directives
      # apply. A consumer gets neither, and that gap hid a total failure: every
      # module required core v0.0.0, a version never tagged, so no project
      # could `go get` any part of Kayan while every other check passed.
      #
      # This validates the last release rather than the working tree, because
      # a release is what a consumer receives.
      - name: Build a throwaway module against the published core
        run: bash scripts/check-consumable.sh

  coverage-floors:
    name: Coverage floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Not a coverage target to chase. It stops packages that were
      # deliberately covered from losing it again: core/admin gates every
      # privileged operation and sat at 11.3%, core/audit is the record an
      # incident is reconstructed from and sat at 13.0%, and nothing objected
      # until somebody looked.
      - name: Reject coverage below the recorded floors
        run: bash scripts/check-coverage.sh

  lint:
    name: Lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ['.', core, kayan-gorm, kayan-ldap, kayan-observability, kayan-oidc-provider, kayan-redis, kayan-saml, kayan-scim, kayan-testing]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          # Pinned deliberately. Every other tool in this repository is pinned
          # to a version or a commit; "latest" meant a new upstream release
          # could turn the build red with no change in the repository, which
          # is indistinguishable from a real regression at the moment it
          # happens.
          #
          # v1.64.8 was built with Go 1.24 and refuses to load a module
          # targeting Go 1.25 at all -- "the Go language version used to build
          # golangci-lint is lower than the targeted Go version" -- so every
          # lint job failed without examining a line of code. A pin has to move
          # when the toolchain does.
          version: v2.13.1
          working-directory: ${{ matrix.module }}

  arch-lint:
    name: Architecture Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # core/ defines contracts; sibling modules implement them. The dependency
      # arrow points one way only. Adding a module here is how that stays true.
      #
      # This resolves real imports via `go list`, not grep over source text —
      # doc comments in core/domain/storage.go reference kayan-gorm as an example,
      # and a lint that fails on documentation is a lint people switch off.
      - name: core must not import sibling modules
        working-directory: core
        run: |
          set -euo pipefail
          imports="$(go list -deps ./... | grep '^github.com/getkayan/kayan/' || true)"
          status=0
          for module in kayan-gorm kayan-ldap kayan-observability kayan-oidc-provider kayan-redis kayan-saml kayan-scim kayan-testing; do
            if echo "${imports}" | grep -q "^github.com/getkayan/kayan/${module}"; then
              echo "ERROR: core/ must not import ${module}/"
              echo "${imports}" | grep "^github.com/getkayan/kayan/${module}"
              status=1
            fi
          done
          exit "${status}"

      # core is what every consumer compiles. A package added here that drags a
      # large dependency tree is paid for by everyone, including deployments
      # that never call it -- which is how the OpenTelemetry SDK, viper, and zap
      # came to sit in core's graph for code nothing imported, taking it from
      # 53 transitive dependencies to 265.
      #
      # The ceiling is the durable half of that fix. Extracting the packages was
      # a one-time correction; this is what stops it happening again, and it
      # fails loudly with the number rather than leaving someone to notice.
      - name: core dependency ceiling
        working-directory: core
        run: |
          set -euo pipefail
          ceiling=90
          count="$(go list -deps ./... | grep -c '\.' )"
          echo "core resolves ${count} transitive dependencies (ceiling ${ceiling})"
          if [ "${count}" -gt "${ceiling}" ]; then
            echo "ERROR: core's dependency graph grew past the ceiling."
            echo "Either the new dependency belongs in an optional module, or the"
            echo "ceiling needs raising deliberately in this workflow."
            exit 1
          fi

      - name: core/identity must have zero internal deps
        working-directory: core
        run: |
          set -euo pipefail
          deps="$(go list -deps ./identity/... | grep '^github.com/getkayan/kayan/core/' | grep -v '^github.com/getkayan/kayan/core/identity$' || true)"
          if [ -n "${deps}" ]; then
            echo "ERROR: core/identity must not import other core/ packages"
            echo "${deps}"
            exit 1
          fi


      # kayan-testing ships in-memory doubles. Importing it from shipping code
      # would put a store that loses everything on restart into production.
      # examples/ is excluded. Every example runs from `go run` with no
      # database, which is what makes them worth reading, and the in-memory
      # store is how that works. They are demonstrations rather than shipping
      # code, and each one says at its import that the store loses everything
      # on restart -- which is the warning the rule exists to deliver.
      - name: kayan-testing must only be imported by tests
        run: |
          set -euo pipefail
          offenders="$(grep -rln 'getkayan/kayan/kayan-testing' --include='*.go' .             | grep -v '_test\.go$' | grep -v '^\./kayan-testing/'             | grep -v '^\./examples/' || true)"
          if [ -n "${offenders}" ]; then
            echo "ERROR: kayan-testing imported outside a _test.go file:"
            echo "${offenders}"
            exit 1
          fi

  build:
    name: Build (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ['.', core, kayan-gorm, kayan-ldap, kayan-observability, kayan-oidc-provider, kayan-redis, kayan-saml, kayan-scim, kayan-testing]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        working-directory: ${{ matrix.module }}
        run: go build ./...

  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Examples are separate modules outside go.work, so nothing built them
      # and they silently stopped compiling when a core interface changed.
      # They are the first thing a user copies, so they are the last thing that
      # should be broken.
      - name: Build every example
        run: |
          set -euo pipefail
          status=0
          for dir in examples/*/backend; do
            [ -f "${dir}/go.mod" ] || continue
            echo "::group::${dir}"
            if ! (cd "${dir}" && GOWORK=off go build ./...); then
              echo "ERROR: ${dir} does not compile"
              status=1
            fi
            echo "::endgroup::"
          done
          exit "${status}"

      # A secret committed in a sample application is the one people paste into
      # production.
      - name: Reject hardcoded session secrets
        run: |
          set -euo pipefail
          if grep -rn 'change-me-in-production\|secret-change-me' examples/ --include='*.go'; then
            echo "ERROR: examples must read SESSION_SECRET, not hardcode a secret"
            exit 1
          fi

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Documentation drifts silently. A sample that names a renamed module or
      # omits a context still renders fine, and the reader only finds out when
      # their code will not build.
      - name: Check documentation samples
        working-directory: tools/docsample
        run: GOWORK=off go run . ../../docs
