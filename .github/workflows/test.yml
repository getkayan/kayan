name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.25.x'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run Core Tests
        working-directory: core
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Run kayan-gorm Tests
        working-directory: kayan-gorm
        run: go test -race ./...

      - name: Run kayan-redis Tests
        working-directory: kayan-redis
        run: go test -race ./...

      - name: Run kayan-oidc-provider Tests
        working-directory: kayan-oidc-provider
        run: go test -race ./...

      - name: Run kayan-saml Tests
        working-directory: kayan-saml
        run: go test -race ./...

      - name: Run kayan-scim Tests
        working-directory: kayan-scim
        run: go test -race ./...

      - name: Run kayan-testing Tests
        working-directory: kayan-testing
        run: go test -race ./...

      - name: Run kayan-ldap Tests
        working-directory: kayan-ldap
        run: go test -race ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          file: core/coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true

  postgres-migrations:
    name: PostgreSQL migration chain
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: kayan
          POSTGRES_PASSWORD: kayan
          POSTGRES_DB: kayan_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kayan -d kayan_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Apply and roll back every PostgreSQL migration
        working-directory: kayan-gorm
        env:
          KAYAN_TEST_DIALECT: postgres
          DATABASE_URL: postgres://kayan:kayan@127.0.0.1:5432/kayan_test?sslmode=disable
        run: go test -race -tags=integration -run '^TestVersionedMigrationChain$' ./...

  mysql-migrations:
    name: MySQL migration chain
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: kayan_test
          MYSQL_USER: kayan
          MYSQL_PASSWORD: kayan
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ukayan -pkayan"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Apply and roll back every MySQL migration
        working-directory: kayan-gorm
        env:
          KAYAN_TEST_DIALECT: mysql
          DATABASE_URL: kayan:kayan@tcp(127.0.0.1:3306)/kayan_test?parseTime=true&multiStatements=true
        run: go test -race -tags=integration -run '^TestVersionedMigrationChain$' ./...

  redis-integration:
    name: Redis adapter integration
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Exercise SSO against real Redis
        working-directory: kayan-redis
        env:
          KAYAN_TEST_REDIS_ADDR: 127.0.0.1:6379
        run: go test -race -tags=integration -run '^TestRealRedisSSOLifecycle$' ./...

  fuzz:
    name: Fuzz (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [kayan-oidc-provider/oauth2, kayan-saml, kayan-scim]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # A short budget per target on every push. Anything in testdata/fuzz is a
      # previously-found crasher and runs as a regression test regardless.
      - name: Run fuzz targets
        working-directory: ${{ matrix.module }}
        run: |
          set -euo pipefail
          targets="$(grep -rho 'func Fuzz[A-Za-z0-9_]*' . --include='*_test.go' | sed 's/func //' | sort -u)"
          if [ -z "${targets}" ]; then
            echo "no fuzz targets in ${PWD}"
            exit 0
          fi
          for target in ${targets}; do
            echo "::group::${target}"
            go test -run "^$" -fuzz "^${target}$" -fuzztime 30s ./... || exit 1
            echo "::endgroup::"
          done
