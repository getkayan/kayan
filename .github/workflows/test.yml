name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.25.x'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run Core Tests
        working-directory: core
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Run kayan-gorm Tests
        working-directory: kayan-gorm
        run: go test -race ./...

      - name: Run kayan-redis Tests
        working-directory: kayan-redis
        run: go test -race ./...

      - name: Run kayan-oidc-provider Tests
        working-directory: kayan-oidc-provider
        run: go test -race ./...

      - name: Run kayan-saml Tests
        working-directory: kayan-saml
        run: go test -race ./...

      - name: Run kayan-scim Tests
        working-directory: kayan-scim
        run: go test -race ./...

      - name: Run kayan-testing Tests
        working-directory: kayan-testing
        run: go test -race ./...

      - name: Run kayan-ldap Tests
        working-directory: kayan-ldap
        run: go test -race ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          file: core/coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true

  # NOTE: The integration job was removed. It ran `go test -tags=integration`
  # against zero build-tagged files, so it reported success while executing
  # nothing. It returns with the migration tests in Phase 5, which need a real
  # Postgres service to verify the migration chain across dialects.

  fuzz:
    name: Fuzz (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [kayan-oidc-provider/oauth2, kayan-saml, kayan-scim]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # A short budget per target on every push. Anything in testdata/fuzz is a
      # previously-found crasher and runs as a regression test regardless.
      - name: Run fuzz targets
        working-directory: ${{ matrix.module }}
        run: |
          set -euo pipefail
          targets="$(grep -rho 'func Fuzz[A-Za-z0-9_]*' . --include='*_test.go' | sed 's/func //' | sort -u)"
          if [ -z "${targets}" ]; then
            echo "no fuzz targets in ${PWD}"
            exit 0
          fi
          for target in ${targets}; do
            echo "::group::${target}"
            go test -run "^$" -fuzz "^${target}$" -fuzztime 30s ./... || exit 1
            echo "::endgroup::"
          done
