name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.25.x'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run Core Tests
        working-directory: core
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Run kgorm Tests
        working-directory: kgorm
        run: go test -race ./...

      - name: Run kredis Tests
        working-directory: kredis
        run: go test -race ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: core/coverage.out
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true

  # NOTE: The integration job was removed. It ran `go test -tags=integration`
  # against zero build-tagged files, so it reported success while executing
  # nothing. It returns with the migration tests in Phase 5, which need a real
  # Postgres service to verify the migration chain across dialects.
