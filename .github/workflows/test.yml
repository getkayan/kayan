name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.25.x'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run Core Tests
        working-directory: core
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Run kayan-gorm Tests
        working-directory: kayan-gorm
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Run kayan-redis Tests
        working-directory: kayan-redis
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Run kayan-oidc-provider Tests
        working-directory: kayan-oidc-provider
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Run kayan-saml Tests
        working-directory: kayan-saml
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Run kayan-scim Tests
        working-directory: kayan-scim
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Run kayan-testing Tests
        working-directory: kayan-testing
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Run kayan-ldap Tests
        working-directory: kayan-ldap
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Run kayan-observability Tests
        working-directory: kayan-observability
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          # Every module reports. Uploading core alone left the adapter
          # numbers invisible -- kayan-oidc-provider/oidc at 37.6% and
          # kayan-ldap at 40.4% were not measured by anything.
          files: >-
            core/coverage.out,kayan-gorm/coverage.out,kayan-redis/coverage.out,
            kayan-scim/coverage.out,kayan-saml/coverage.out,
            kayan-oidc-provider/coverage.out,kayan-ldap/coverage.out,
            kayan-observability/coverage.out,
            kayan-testing/coverage.out
          flags: unittests
          name: codecov-umbrella
          # codecov-action v4 requires a token even for a public repository.
          # Without the secret the upload fails; the job does not, because
          # coverage reporting is not what gates this build. The floors in
          # scripts/check-coverage.sh are, and they run in their own job with
          # no third-party dependency.
          #
          # Failing the build when a reporting service is unreachable teaches
          # people that red CI is normal, which is how a genuinely broken
          # build goes unnoticed.
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  postgres-migrations:
    name: PostgreSQL migration chain
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: kayan
          POSTGRES_PASSWORD: kayan
          POSTGRES_DB: kayan_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kayan -d kayan_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Apply and roll back every PostgreSQL migration
        working-directory: kayan-gorm
        env:
          KAYAN_TEST_DIALECT: postgres
          DATABASE_URL: postgres://kayan:kayan@127.0.0.1:5432/kayan_test?sslmode=disable
        run: bash ../scripts/run-integration.sh

  mysql-migrations:
    name: MySQL migration chain
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: kayan_test
          MYSQL_USER: kayan
          MYSQL_PASSWORD: kayan
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ukayan -pkayan"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Apply and roll back every MySQL migration
        working-directory: kayan-gorm
        env:
          KAYAN_TEST_DIALECT: mysql
          DATABASE_URL: kayan:kayan@tcp(127.0.0.1:3306)/kayan_test?parseTime=true&multiStatements=true
        run: bash ../scripts/run-integration.sh

  redis-integration:
    name: Redis adapter integration
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Exercise SSO and tenant governance against real Redis
        working-directory: kayan-redis
        env:
          KAYAN_TEST_REDIS_ADDR: 127.0.0.1:6379
        run: bash ../scripts/run-integration.sh

  fuzz:
    name: Fuzz (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [kayan-oidc-provider/oauth2, kayan-saml, kayan-scim]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # A short budget per target on every push. Anything in testdata/fuzz is a
      # previously-found crasher and runs as a regression test regardless.
      - name: Run fuzz targets
        working-directory: ${{ matrix.module }}
        run: |
          set -euo pipefail
          targets="$(grep -rho 'func Fuzz[A-Za-z0-9_]*' . --include='*_test.go' | sed 's/func //' | sort -u)"
          if [ -z "${targets}" ]; then
            echo "no fuzz targets in ${PWD}"
            exit 0
          fi
          # -fuzz takes exactly one package. Passing ./... works only while a
          # module happens to hold a single package, and kayan-scim has two, so
          # every fuzz run there failed with "cannot use -fuzz flag with
          # multiple packages" rather than fuzzing anything.
          for target in ${targets}; do
            pkg="$(grep -rl "func ${target}(" . --include='*_test.go' | head -1 | xargs dirname)"
            echo "::group::${target} (${pkg})"
            if ! go test -run "^$" -fuzz "^${target}$" -fuzztime 30s "${pkg}"; then
              # Go's fuzz coordinator can occasionally lose a worker on a
              # constrained hosted runner. A real crasher is written into the
              # corpus, so prove the complete corpus still passes before one
              # lower-parallelism retry. Deterministic defects fail here and
              # are never hidden by the retry.
              echo "::warning::fuzz worker exited; validating corpus before retry"
              go test -run "^${target}($|/)" "${pkg}"
              go test -run "^$" -fuzz "^${target}$" -fuzztime 30s -parallel 1 "${pkg}"
            fi
            echo "::endgroup::"
          done
