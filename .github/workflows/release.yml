name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build artifacts for
        required: true

env:
  GO_VERSION: '1.25.x'

permissions:
  contents: read

jobs:
  # Nothing is published for a tag that does not build and test cleanly.
  verify:
    name: Verify (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        module:
          - core
          - kayan-gorm
          - kayan-ldap
          - kayan-oidc-provider
          - kayan-redis
          - kayan-saml
          - kayan-scim
          - kayan-testing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build and test
        working-directory: ${{ matrix.module }}
        run: |
          go build ./...
          go test -race ./...

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
      id-token: write # for keyless signing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # An IAM library's dependency tree is what a consumer has to audit when a
      # CVE lands upstream. Publishing it per release means they do not have to
      # reconstruct it from a tag.
      - name: Generate a CycloneDX SBOM per module
        run: |
          set -euo pipefail
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@latest
          mkdir -p sbom
          for module in core kayan-gorm kayan-ldap kayan-oidc-provider \
                        kayan-redis kayan-saml kayan-scim kayan-testing; do
            cyclonedx-gomod mod -json -licenses -output "sbom/${module}.cdx.json" "./${module}"
          done

      - name: Install cosign
        uses: sigstore/cosign-installer@1aa8e0f2454b781fbf0fbf306a4c9533a0c57409 # v3.7.0

      # Keyless signing binds each SBOM to this workflow run through Fulcio and
      # Rekor, so a consumer can verify where it came from without Kayan
      # holding a signing key.
      - name: Sign the SBOMs
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          for file in sbom/*.cdx.json; do
            cosign sign-blob --yes \
              --output-signature "${file}.sig" \
              --output-certificate "${file}.pem" \
              "${file}"
          done

      - name: Attach the SBOMs to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" sbom/* --clobber

      - name: Upload the SBOMs as a workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom/
          retention-days: 90
