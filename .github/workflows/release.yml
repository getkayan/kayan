name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build artifacts for
        required: true

env:
  GO_VERSION: '1.25.x'

permissions:
  contents: read

jobs:
  # Nothing is published for a tag that does not build and test cleanly.
  verify:
    name: Verify (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        module:
          - .
          - core
          - kayan-gorm
          - kayan-ldap
          - kayan-observability
          - kayan-oidc-provider
          - kayan-redis
          - kayan-saml
          - kayan-scim
          - kayan-testing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build and test
        working-directory: ${{ matrix.module }}
        run: |
          go build ./...
          go test -race ./...

  module-tags:
    name: Publish synchronized module tags
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Create submodule tags at the verified commit
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for module in core kayan-gorm kayan-ldap kayan-observability kayan-oidc-provider \
                        kayan-redis kayan-saml kayan-scim kayan-testing; do
            tag="${module}/${RELEASE_VERSION}"
            if git rev-parse --verify --quiet "refs/tags/${tag}"; then
              echo "${tag} already exists"
              continue
            fi
            git tag "${tag}" "${GITHUB_SHA}"
            git push origin "refs/tags/${tag}"
          done

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [verify, module-tags]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Create the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" --verify-tag \
              --title "Kayan ${GITHUB_REF_NAME}" --generate-notes
          fi
